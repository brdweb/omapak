name: publish

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "omapak.flatpakrepo"
      - "deploy/push-to-r2.py"
      - "deploy/pull-from-r2.py"
      - "deploy/install-runtimes.sh"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

# Serialize every summary writer. Concurrent publishes each restore R2
# at their own start and push their own summary — the last one to land
# wins and can drop refs the others added (four merges in 14 minutes
# once left three newly-merged apps out of the live summary). No
# cancel-in-progress: killing a run between the summary and summary.sig
# uploads would break every client.
concurrency:
  group: repo-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore repo refs from R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p repo/refs/heads repo/objects repo/refs/remotes repo/refs/mirrors repo/extensions
          printf '[core]\nrepo_version=1\nmode=archive-z2\n' > repo/config
          # rclone's listing of the ~30k-object bucket fails silently; boto3
          # is the proven path for everything R2 in this repo
          pip install -q boto3
          python3 deploy/pull-from-r2.py repo
          echo "existing omapak app refs:"
          ls repo/refs/heads/app/ 2>/dev/null || echo "(none — first run)"
          [ -n "$(ls repo/refs/heads/app/ 2>/dev/null)" ] || \
            echo "::warning::no omapak refs restored — if this is not the first run, the restore failed"

      - name: Cache flatpak builds
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          # v2: the v1 cache carried commit state from pre-R2 local test
          # builds that broke exports
          key: flatpak-builds-v2-${{ runner.os }}-${{ hashFiles('apps/**') }}
          restore-keys: flatpak-builds-v2-

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          # Runtime deps of flatpak-builder 1.4.11 below: it shells out to
          # bsdunzip (.zip sources), appstreamcli compose (export) and
          # eu-strip (debuginfo) — none ship on the runner since the
          # 2026-09 image drift.
          sudo apt-get install -y flatpak ostree \
            libarchive-tools appstream-compose appstream elfutils

      # Same builder as the judge, copied verbatim. apt's 1.4.2 cannot
      # expand bare-string source includes ("modules: [ foo.json ]"),
      # which 1.4.11 accepts — OmaAmp passed the judge and then failed
      # here with "sdk not specified" (2026-09-16). One builder version
      # everywhere ends that drift class.
      - name: Cache flatpak-builder 1.4.11
        id: fbcache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatpak-builder
          key: flatpak-builder-1.4.11-v1
      - name: Build flatpak-builder 1.4.11
        if: steps.fbcache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y meson ninja-build build-essential \
            libflatpak-dev libcurl4-openssl-dev libyaml-dev libjson-glib-dev libelf-dev
          curl -sL -o /tmp/fb.tar.xz \
            https://github.com/flatpak/flatpak-builder/releases/download/1.4.11/flatpak-builder-1.4.11.tar.xz
          echo "2a5ef4f3eaea86f808aa477e57e65b6f68978eb1c034fafe05bffdebbf1dcd03  /tmp/fb.tar.xz" | sha256sum -c
          tar -C /tmp -xf /tmp/fb.tar.xz
          cd /tmp/flatpak-builder-1.4.11
          sed -i \
            -e "s|find_program('appstreamcli', version: '>= 0.15.0')|find_program('appstreamcli', version: '>= 0.15.0', required: false)|" \
            -e "s|run_command(appstreamcli, \['compose', '--help'\], check: true)|run_command('false', check: false)|" \
            meson.build
          meson setup build --buildtype=release -D docs=disabled -D tests=false
          ninja -C build
          sudo install -m755 build/src/flatpak-builder /usr/local/bin/flatpak-builder
      - name: flatpak-builder version check
        run: flatpak-builder --version

      - name: Install runtimes
        run: ./deploy/install-runtimes.sh

      # Commits must be signed: the remote runs gpg-verify=true, so an
      # unsigned app commit fails the client pull even with a signed summary.
      - name: Import signing key
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: echo "$OMAPAK_GPG_KEY" | gpg --import

      - name: Build all apps (cached, unchanged skip compile)
        id: build
        run: |
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          # Export to a fresh scratch repo: the .flatpak-builder cache can
          # reference commit state from machines whose objects never
          # reached R2, and reusing an old commit requires reading its
          # full tree. A scratch repo forces a fresh signed commit every
          # time; the compile cache still does its job.
          rm -rf build-repo
          mkdir -p build-repo/objects build-repo/refs/heads build-repo/refs/remotes build-repo/refs/mirrors
          printf '[core]\nrepo_version=1\nmode=archive-z2\n' > build-repo/config
          failed=""
          for app in apps/*/; do
            name=$(basename "$app")
            # Pick the app-id-named manifest like the judge does
            # (omapak-core find_manifest): a plain find grabs whichever
            # .json lands first, which fed flatpak-builder a
            # python3-requirements.json fragment as OmaAmp's manifest
            # ("Failed to init: sdk not specified", 2026-09-16).
            manifest=""
            for cand in "$name.yml" "$name.yaml" "$name.json"; do
              [ -f "$app/$cand" ] && manifest="$app/$cand" && break
            done
            if [ -z "$manifest" ]; then
              manifest=$(find "$app" -maxdepth 1 \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) \
                ! -name 'metadata.yml' ! -name 'flathub.json' \
                ! -name '*-sources.json' ! -name '*-dependencies.json' | head -1)
            fi
            [ -n "$manifest" ] || continue
            echo "::group::build $name"
            if flatpak-builder --force-clean --disable-rofiles-fuse --user \
                --gpg-sign="$keyid" \
                --repo=build-repo ".flatpak-builder/$name" "$manifest" >"/tmp/build-$name.log" 2>&1; then
              tail -5 "/tmp/build-$name.log"
            else
              tail -30 "/tmp/build-$name.log"
              failed="$failed $name"
            fi
            echo "::endgroup::"
          done
          # Fold successful exports into the restored repo
          ostree pull-local --repo=repo build-repo
          # Recorded for the post-push gate: failed apps keep their last
          # good ref in the repo (restored from R2), the rest publish, and
          # the run still goes red so nobody misses it.
          echo "FAILED_BUILDS=$failed" >> "$GITHUB_ENV"

      - name: Extract icons from builds (non-blocking)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Extract the hicolor app icon from each built app and push to R2
          for app in apps/*/; do
            name=$(basename "$app")
            icon=$(find ".flatpak-builder/$name/files/share/icons/hicolor" -name "$name*" -type f 2>/dev/null | sort -r | head -1)
            [ -n "$icon" ] || continue
            echo "icon for $name: $icon"
            curl -s -o /dev/null -w "  push: %{http_code}\n" \
              -X PUT "https://api.cloudflare.com/client/v4/accounts/7396d8475acc6c87ef13e97a617712f1/r2/buckets/omapak-repo/objects/icons/$name.png" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --data-binary "@$icon" || echo "  icon push failed for $name"
          done


      - name: Merge flathub catalog refs (metadata only)
        run: |
          curl -sO https://dl.flathub.org/repo/flathub.flatpakrepo
          grep '^GPGKey=' flathub.flatpakrepo | cut -d= -f2- | base64 -d > flathub-keyring.gpg
          ostree remote add --repo=repo --gpg-import=flathub-keyring.gpg \
            flathub https://dl.flathub.org/repo/ 2>/dev/null || true
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo 2>/dev/null || true
          flatpak --user remote-ls --columns=ref flathub 2>/dev/null | grep -E '^(app|runtime)/' > /tmp/refs.txt || true
          # An empty listing means the catalog would vanish from the
          # summary on re-sign — fail instead.
          [ -s /tmp/refs.txt ] || { echo "::error::no flathub refs listed"; exit 1; }
          wc -l /tmp/refs.txt
          xargs -a /tmp/refs.txt -n 50 ostree pull --repo=repo --mirror \
            --commit-metadata-only flathub 2>/dev/null || true
          cd repo
          find refs/mirrors -type f 2>/dev/null | while read -r f; do
            ref="${f#refs/mirrors/*/}"
            mkdir -p "refs/heads/$(dirname "$ref")"
            cp "$f" "refs/heads/$ref"
          done
          cd ..
          echo "refs going into summary: $(find repo/refs/heads -type f | wc -l)"

      - name: Sign combined summary
        env:
          OMAPAK_GPG_KEY: ${{ secrets.OMAPAK_GPG_KEY }}
        run: |
          echo "$OMAPAK_GPG_KEY" | gpg --import
          keyid=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/{print $5; exit}')
          # Refs restored from R2 can point at unreadable commit objects
          # (truncated uploads). Let summary --update name the offender,
          # drop that ref, retry — provenance checks proved unreliable.
          ok=""
          for attempt in $(seq 1 20); do
            if ostree summary --update --repo=repo --gpg-sign="$keyid" 2>/tmp/summary.err; then ok=1; break; fi
            ghost=$(grep -oE '[0-9a-f]{64}\.commit' /tmp/summary.err | head -1 | cut -d. -f1)
            if [ -z "$ghost" ]; then cat /tmp/summary.err; exit 1; fi
            echo "summary retry $attempt: dropping ref to unreadable commit $ghost"
            # summary collects heads + remotes (and mirrors feed heads),
            # so hunt the whole refs tree
            grep -rl "^$ghost$" repo/refs 2>/dev/null | while read -r f; do echo "  removing $f"; rm -f "$f"; done
          done
          [ "$ok" = 1 ] || { echo "summary never succeeded"; exit 1; }

      - name: Push to R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          python3 deploy/push-to-r2.py repo

      # The site reads data/catalog.json from R2 — without this step it
      # only ever changed when the generator was run by hand (it sat
      # stale for three days while apps merged).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild site catalog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm install --prefix web --no-audit --no-fund yaml
          node web/scripts/push-catalog.mjs

      # Gate comes after the push: the repo serves last-good refs for
      # failed apps while the red X makes the failure impossible to miss.
      - name: Fail on build/runtime failures
        if: always()
        run: |
          rt_failed=$(cat /tmp/rt-failed.txt 2>/dev/null || true)
          if [ -n "${FAILED_BUILDS:-}" ] || [ -n "$rt_failed" ]; then
            echo "::error::build failures:${FAILED_BUILDS:-} runtime failures:$rt_failed"
            exit 1
          fi
